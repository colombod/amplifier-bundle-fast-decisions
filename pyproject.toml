[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amplifier-fast-decisions"
version = "0.1.0"
description = "A Foundation-compatible hybrid decision orchestrator and local routing observatory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amplifier Fast Decisions contributors"}]
keywords = ["amplifier", "agent", "orchestration", "decision-routing", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk"]
local = ["httpx>=0.27,<1"]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
anyjev = ["anyjev[hf] @ git+https://github.com/nokia-applied-research/AnyJev@45add301a7aa60ed3420c83d15c061e84e5bce61"]
amplifier = [
  "amplifier-core @ git+https://github.com/microsoft/amplifier-core@6d4cd217f83bb29b671b5c9d854aaa08be14db1b",
  "amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@4cc86dd4eae36b40af38b4e2e70b9045649d2903",
]
test = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/michaeljabbour/amplifier-bundle-fast-decisions"
Repository = "https://github.com/michaeljabbour/amplifier-bundle-fast-decisions"
Issues = "https://github.com/michaeljabbour/amplifier-bundle-fast-decisions/issues"
Documentation = "https://github.com/michaeljabbour/amplifier-bundle-fast-decisions/blob/main/docs/ARCHITECTURE.md"

[project.scripts]
amplifier-fast-decisions = "amplifier_fast_decisions.smart_cli:main"
afast = "amplifier_fast_decisions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amplifier_fast_decisions*"]

[tool.setuptools.package-data]
amplifier_fast_decisions = ["static/*", "SMART_TOOL.md", "policies/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["upstream: requires installed real Amplifier core and loop", "live: requires an explicit live Jev API opt-in"]
