[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amplifier-module-tool-jevgrep"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["amplifier-fast-decisions @ git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@main"]

[project.entry-points."amplifier.modules"]
tool-jevgrep = "amplifier_module_tool_jevgrep:mount"

[tool.setuptools.packages.find]
include = ["amplifier_module_tool_jevgrep*"]
