schema: fast-decisions-evals/suites/v1

# Decision (2026-09-20b), see STUDY-DESIGN.md section 12: reps default to 3 on
# --split dev (selection) and 5 on --split holdout (confirmation), for both s1
# and s2. --reps on the CLI always overrides this.
#
# holdout2 (2026-09-25): a fresh 12-task S1 holdout split (3 per family),
# added in scripts/battery_tasks.py to replace the original 8-task `holdout`
# split after it was spent (used twice). Same confirmation-style reps
# default as `holdout`. `holdout` itself is left untouched.
reps_defaults:
  dev: 3
  holdout: 5
  holdout2: 5
  m-dev: 3

suites:
  s1:
    label: "S1 synthetic battery (32 tasks, 4 families)"
    task_source: battery           # battery.py --task-source battery
    deadline_seconds: 600
    splits:
      dev:      { tasks_flag: dev,      expected_task_count: 12 }
      holdout:  { tasks_flag: holdout,  expected_task_count: 8 }
      holdout2: { tasks_flag: holdout2, expected_task_count: 12 }
    required_toolchains: [python3]

  # s1m (2026-09-25): multi-turn scenario battery. Each task is one Amplifier
  # session, 4 turns, --resume'd between them -- measuring per-turn routing
  # (model switches mid-session) and its prompt-cache cost, which no
  # single-turn S1 task can. Scenarios are built ONLY from existing S1 dev
  # tasks (scripts/battery_tasks.py's scn_dev_1..3); no new fixture content.
  s1m:
    label: "S1M multi-turn scenarios (3 scenarios, 4 turns each, built from S1 dev tasks)"
    task_source: battery           # battery.py --task-source battery
    deadline_seconds: 600          # per-turn deadline (battery.py prepare's --deadline-seconds)
    splits:
      m-dev: { tasks_flag: m-dev, expected_task_count: 3 }
    required_toolchains: [python3]

  s2:
    label: "S2 aider polyglot slice (40 tasks: python/rust/go/cpp)"
    task_source: polyglot          # battery.py --task-source polyglot
    deadline_seconds: 900
    polyglot:
      root_env: AFAST_POLYGLOT_ROOT      # or --polyglot-root on the CLI
      pinned_corpus_sha: "7e0611e"       # prefix-matched against polyglot-manifest.json .sha
      languages: [python, rust, go, cpp]
      slice: 40
      seed: 20260919                     # fixed: changing it changes the split
    splits:
      dev:     { split_flag: dev,     expected_task_count: 24 }
      holdout: { split_flag: holdout, expected_task_count: 16 }
    required_toolchains: [python3, cargo, go, cmake]
    excluded_languages:
      java: "corpus ships no junit-platform-console-standalone jar; polyglot_tasks.load() skips java"
      javascript: "grading needs `npx --no-install jest` with node_modules present; corpus is not vendored offline"
