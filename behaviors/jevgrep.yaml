bundle:
  name: fast-decisions-jevgrep
  version: 0.1.0
  description: Default natural-language code retrieval through the normal host tool path.

tools:
  - module: tool-jevgrep
    source: git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@main#subdirectory=modules/tool-jevgrep
    config:
      root: .
      executable: jg
      # Upstream Jevgrep is enabled; source sharing is explicit in this behavior.
      backend: jev
      allow_external_state: true
      timeout_ms: 60000
      max_source_bytes: 32768
      max_output_bytes: 65536
      concurrency: 4

context:
  include:
    - fast-decisions:context/jevgrep.md
