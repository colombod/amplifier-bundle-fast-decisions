name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  hosted-laya:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[serve,local,test]'
      - run: python -m unittest discover -s tests -p 'test_laya_hosted.py' -v
      - run: python -m unittest discover -s tests -p 'test_laya_client_key.py' -v

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_viewer.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_viewer_browser.py' -v

  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src/amplifier_fast_decisions
# Deliberately no live inference, API keys or shell/tool execution in this job.

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,amplifier]'
      - run: python -m pip install "git+https://github.com/microsoft/amplifier-foundation@main"
      - run: python -m unittest discover -s tests -v
      - run: python -m amplifier_fast_decisions doctor
        # Not --require-amplifier: that flag's module_entry_points check needs the
        # modules/*/ packages (loop-fast-decisions, hooks-fast-decisions,
        # tool-fast-workspace) installed too, which is the Amplifier bundle
        # loader's job, not this job's `pip install -e '.[test,amplifier]'`.
        # Failing on that here would be a packaging-scope gap, not a real
        # regression, so this lane runs the plain (non-failing) doctor check.

  upstream-main:
    # Drift canary against the unpinned @main branches of amplifier-core and
    # amplifier-module-loop-streaming (the pinned SHAs are the real gate,
    # in the `upstream` job above). continue-on-error: true means this job
    # never blocks merges; it only surfaces upstream API drift early.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install "git+https://github.com/microsoft/amplifier-core@main"
      - run: python -m pip install "git+https://github.com/microsoft/amplifier-module-loop-streaming@main"
      - run: python -m pip install "git+https://github.com/microsoft/amplifier-foundation@main"
      - run: python -m unittest discover -s tests -v
      - run: python -m amplifier_fast_decisions doctor

  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: amplifier-fast-decisions manifest
      - run: amplifier-fast-decisions describe
      - run: python -m unittest discover -s tests -p 'test_smart_tool.py' -v
      - run: python -m unittest discover -s tests -p 'test_operations.py' -v
